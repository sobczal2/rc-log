[package]
name = "rc-log-api"
version = "0.1.0"
edition = "2024"

[dependencies]
rc-log-application.workspace = true
rc-log-domain.workspace = true
rc-log-persistance.workspace = true
axum = { workspace = true, features = ["macros", "multipart"] }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["serde"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid"] }
thiserror.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower-http = { workspace = true, features = ["fs", "trace"] }

